<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Passcode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #8B0000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .main-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 90%;
            max-width: 1000px;
            gap: 80px;
        }

        .left-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .picture-frame {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 420px;
            height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .picture-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .input-display {
            display: flex;
            gap: 15px;
            justify-content: center;
            min-height: 50px;
        }

        .input-box {
            width: 50px;
            height: 50px;
            border: 3px solid white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: transparent;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .key:hover {
            transform: scale(1.1);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }

        .key:active {
            transform: scale(0.95);
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        .enter-btn {
            background-color: #228B22;
        }

        .enter-btn:hover {
            background-color: #1a6b1a;
            transform: scale(1.05);
        }

        .clear-btn {
            background-color: #FF6B6B;
        }

        .clear-btn:hover {
            background-color: #E74C3C;
            transform: scale(1.05);
        }

        .error {
            color: #FFD700;
            text-align: center;
            font-size: 16px;
            min-height: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                gap: 40px;
            }
            
            .picture-frame {
                width: 200px;
                height: 250px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-section">
            <div class="picture-frame">
                <img src="Dhruthi.jpeg" alt="Birthday girl">
            </div>
        </div>

        <div class="right-section">
            <div class="title">Entre a passcode</div>
            
            <div class="input-display" id="display">
                <div class="input-box"></div>
                <div class="input-box"></div>
                <div class="input-box"></div>
                <div class="input-box"></div>
            </div>

            <div class="keypad">
                <button class="key" onclick="addNumber('1')">1</button>
                <button class="key" onclick="addNumber('2')">2</button>
                <button class="key" onclick="addNumber('3')">3</button>
                <button class="key" onclick="addNumber('4')">4</button>
                <button class="key" onclick="addNumber('5')">5</button>
                <button class="key" onclick="addNumber('6')">6</button>
                <button class="key" onclick="addNumber('7')">7</button>
                <button class="key" onclick="addNumber('8')">8</button>
                <button class="key" onclick="addNumber('9')">9</button>
                <button class="key" onclick="addNumber('*')">*</button>
                <button class="key" onclick="addNumber('0')">0</button>
                <button class="key" onclick="addNumber('#')">#</button>
            </div>

            <div class="buttons">
                <button class="btn enter-btn" onclick="enterPasscode()">ENTER</button>
                <button class="btn clear-btn" onclick="clearPasscode()">CLEAR</button>
            </div>

            <div style="text-align: center; color: white; margin-top: 20px; font-size: 18px; font-style: italic; font-weight: bold;">
                hint- it's our bday dates
            </div>

            <div class="error" id="error"></div>
        </div>
    </div>

    <script>
        let passcode = '';
        const correctPasscode = '0810';
        const inputBoxes = document.querySelectorAll('.input-box');

        function addNumber(num) {
            if (passcode.length < 4) {
                passcode += num;
                updateDisplay();
            }
        }

        function updateDisplay() {
            inputBoxes.forEach((box, index) => {
                if (index < passcode.length) {
                    box.textContent = '-';
                } else {
                    box.textContent = '';
                }
            });
        }

        function clearPasscode() {
            passcode = '';
            updateDisplay();
            document.getElementById('error').textContent = '';
        }

        function enterPasscode() {
            if (passcode === correctPasscode) {
                window.location.href = 'apology.html';
            } else {
                document.getElementById('error').textContent = 'Wrong passcode! Try again.';
                passcode = '';
                updateDisplay();
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enterPasscode();
            }
        });
    </script>
</body>
</html>
